# ============================================
# Prometheus Configuration
# OpenStack CIS Compliance Monitoring
# ============================================

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    monitor: 'openstack-compliance'
    environment: 'production'

# Alerting Configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'
      timeout: 10s

# Alert Rules
rule_files:
  - '/etc/prometheus/alert-rules.yml'

# Scrape Configurations
scrape_configs:
  # ============================================
  # Prometheus Self-Monitoring
  # ============================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          component: 'prometheus'

  # ============================================
  # Compliance Exporter
  # ============================================
  - job_name: 'compliance_exporter'
    scrape_interval: 60s  # Scan results don't change frequently
    scrape_timeout: 30s
    static_configs:
      - targets: ['exporter:9100']
        labels:
          component: 'compliance-exporter'
          framework: 'openstack-cis'
    metric_relabel_configs:
      # Add additional labels for filtering
      - source_labels: [__name__]
        regex: 'openstack_.*'
        target_label: 'source'
        replacement: 'inspec'

  # ============================================
  # Alertmanager Monitoring
  # ============================================
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
        labels:
          component: 'alertmanager'

  # ============================================
  # Node Exporter (Optional - Host Metrics)
  # ============================================
  # Uncomment if you have node_exporter running
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['localhost:9100']
  #       labels:
  #         component: 'node-exporter'

  # ============================================
  # OpenStack API Endpoints (Optional)
  # ============================================
  # Uncomment to monitor OpenStack APIs directly
  # - job_name: 'openstack-api'
  #   scheme: https
  #   tls_config:
  #     insecure_skip_verify: true
  #   static_configs:
  #     - targets:
  #         - 'keystone.example.com:5000'
  #         - 'nova.example.com:8774'
  #         - 'neutron.example.com:9696'
  #   metrics_path: /metrics
