---
# OpenStack Hardening Playbook
# Based on CIS OpenStack Foundations Benchmark

- name: Harden OpenStack Controller Node
  hosts: controller
  become: yes
  vars:
    openstack_services:
      - keystone
      - nova
      - neutron
      - cinder
      - glance
      - swift
    config_mode: '0640'
    
  tasks:
    # ============================================
    # Section 1: Identity (Keystone)
    # ============================================
    - name: "[1.1] Set keystone.conf ownership"
      file:
        path: /etc/keystone/keystone.conf
        owner: root
        group: keystone
        mode: "{{ config_mode }}"
      tags: [identity, keystone]

    - name: "[1.2] Ensure Keystone uses Fernet tokens"
      ini_file:
        path: /etc/keystone/keystone.conf
        section: token
        option: provider
        value: fernet
        backup: yes
      notify: restart keystone
      tags: [identity, keystone]

    - name: "[1.3] Set token expiration to 1 hour"
      ini_file:
        path: /etc/keystone/keystone.conf
        section: token
        option: expiration
        value: "3600"
        backup: yes
      notify: restart keystone
      tags: [identity, keystone]

    - name: "[1.4] Disable admin token"
      ini_file:
        path: /etc/keystone/keystone.conf
        section: DEFAULT
        option: admin_token
        state: absent
        backup: yes
      notify: restart keystone
      tags: [identity, keystone]

    # ============================================
    # Section 2: Compute (Nova)
    # ============================================
    - name: "[2.1] Set nova.conf ownership"
      file:
        path: /etc/nova/nova.conf
        owner: root
        group: nova
        mode: "{{ config_mode }}"
      tags: [compute, nova]

    - name: "[2.2] Disable VNC if not needed"
      ini_file:
        path: /etc/nova/nova.conf
        section: vnc
        option: enabled
        value: "false"
        backup: yes
      notify: restart nova-api
      tags: [compute, nova]
      when: disable_vnc | default(false)

    - name: "[2.3] Ensure Nova uses secure auth"
      ini_file:
        path: /etc/nova/nova.conf
        section: keystone_authtoken
        option: auth_type
        value: password
        backup: yes
      notify: restart nova-api
      tags: [compute, nova]

    - name: "[2.4] Configure HTTPS for Glance API"
      ini_file:
        path: /etc/nova/nova.conf
        section: glance
        option: api_servers
        value: "https://{{ glance_host }}:9292"
        backup: yes
      notify: restart nova-api
      tags: [compute, nova]
      when: glance_host is defined

    # ============================================
    # Section 3: Networking (Neutron)
    # ============================================
    - name: "[3.1] Set neutron.conf ownership"
      file:
        path: /etc/neutron/neutron.conf
        owner: root
        group: neutron
        mode: "{{ config_mode }}"
      tags: [networking, neutron]

    - name: "[3.2] Enable SSL for Neutron API"
      ini_file:
        path: /etc/neutron/neutron.conf
        section: ssl
        option: use_ssl
        value: "true"
        backup: yes
      notify: restart neutron-server
      tags: [networking, neutron]

    - name: "[3.3] Set auth_strategy to keystone"
      ini_file:
        path: /etc/neutron/neutron.conf
        section: DEFAULT
        option: auth_strategy
        value: keystone
        backup: yes
      notify: restart neutron-server
      tags: [networking, neutron]

    # ============================================
    # Section 4: Storage (Cinder)
    # ============================================
    - name: "[4.1] Set cinder.conf ownership"
      file:
        path: /etc/cinder/cinder.conf
        owner: root
        group: cinder
        mode: "{{ config_mode }}"
      tags: [storage, cinder]

    - name: "[4.2] Enable NAS secure file permissions"
      ini_file:
        path: /etc/cinder/cinder.conf
        section: DEFAULT
        option: nas_secure_file_permissions
        value: "auto"
        backup: yes
      notify: restart cinder-volume
      tags: [storage, cinder]

    - name: "[4.3] Enable NAS secure file operations"
      ini_file:
        path: /etc/cinder/cinder.conf
        section: DEFAULT
        option: nas_secure_file_operations
        value: "auto"
        backup: yes
      notify: restart cinder-volume
      tags: [storage, cinder]

  handlers:
    - name: restart keystone
      service:
        name: apache2
        state: restarted

    - name: restart nova-api
      service:
        name: nova-api
        state: restarted

    - name: restart neutron-server
      service:
        name: neutron-server
        state: restarted

    - name: restart cinder-volume
      service:
        name: cinder-volume
        state: restarted

# ============================================
# Compute Node Hardening
# ============================================
- name: Harden OpenStack Compute Nodes
  hosts: compute
  become: yes
  vars:
    config_mode: '0640'

  tasks:
    - name: "[2.1] Set nova.conf ownership on compute"
      file:
        path: /etc/nova/nova.conf
        owner: root
        group: nova
        mode: "{{ config_mode }}"
      tags: [compute, nova]

    - name: "[2.5] Set libvirt security driver"
      ini_file:
        path: /etc/libvirt/qemu.conf
        section: null
        option: security_driver
        value: '"selinux"'
        backup: yes
      notify: restart libvirtd
      tags: [compute, libvirt]

    - name: "[2.6] Enable live migration encryption"
      ini_file:
        path: /etc/nova/nova.conf
        section: libvirt
        option: live_migration_tunnelled
        value: "true"
        backup: yes
      notify: restart nova-compute
      tags: [compute, nova]

  handlers:
    - name: restart libvirtd
      service:
        name: libvirtd
        state: restarted

    - name: restart nova-compute
      service:
        name: nova-compute
        state: restarted
